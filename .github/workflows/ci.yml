name: CI

# Integracao Continua: roda em toda branch do Gitflow e em todo Pull Request.
on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

env:
  NODE_VERSION_PADRAO: '20'

jobs:
  # ---------------------------------------------------------------- stage: lint
  lint:
    name: Lint (padroes de codigo)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_PADRAO }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar o ESLint
        run: npm run lint

  # ---------------------------------------------------------------- stage: test
  # Depende do lint. Roda em paralelo com o job de seguranca.
  test:
    name: Testes (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20']
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Rodar os testes com cobertura
        run: npm run test:coverage

      - name: Publicar o relatorio de cobertura
        if: matrix.node == '20'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 7

  # ------------------------------------------------------------ stage: security
  # Depende do lint. Roda em paralelo com os testes.
  security:
    name: Testes de seguranca
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_PADRAO }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de vulnerabilidades nas dependencias
        # So as dependencias de producao (as que vao na imagem). Um aviso novo em
        # ferramentas de desenvolvimento (jest) nao deve travar a entrega.
        run: npm audit --omit=dev --audit-level=high

      - name: Procurar segredos escritos direto no codigo
        run: |
          echo "Varrendo o codigo em busca de segredos expostos..."
          PADRAO='(AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----|(password|senha|secret|api_key)[[:space:]]*=[[:space:]]*["'"'"'][^"'"'"']{8,})'
          if grep -rInE "$PADRAO" src public 2>/dev/null; then
            echo "::error::Possivel segredo encontrado no codigo-fonte."
            exit 1
          fi
          echo "Nenhum segredo encontrado."

  # ---------------------------------------------------------------- stage: SAST
  # Analise estatica do codigo-fonte (Semgrep). Depende do lint e roda em
  # paralelo com os testes e com a auditoria de dependencias.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Rodar o Semgrep
        # --error faz o comando sair com codigo 1 se houver achado ERROR.
        # O relatorio JSON e gerado mesmo quando a validacao falha.
        run: |
          mkdir -p relatorios
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.97.0 \
            semgrep scan \
              --config p/javascript --config p/nodejs --config p/owasp-top-ten \
              --metrics=off --severity ERROR --error \
              --json-output=relatorios/semgrep.json \
              src public

      - name: Validar o resultado (zero achados de severidade ERROR)
        if: always()
        run: |
          test -f relatorios/semgrep.json || { echo "::error::Semgrep nao gerou relatorio."; exit 1; }
          TOTAL=$(node -p "require('./relatorios/semgrep.json').results.length")
          {
            echo "## SAST (Semgrep)"
            echo ""
            echo "Achados de severidade ERROR: **$TOTAL**"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$TOTAL" -gt 0 ]; then
            echo "::error::O SAST encontrou $TOTAL vulnerabilidade(s) de severidade ERROR."
            exit 1
          fi
          echo "SAST sem achados criticos."

      - name: Publicar o relatorio do SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast
          path: relatorios/semgrep.json
          retention-days: 7

  # --------------------------------------------------------------- stage: build
  # So executa se testes, seguranca E SAST passarem. Se um deles falhar,
  # este job aparece como "skipped" e a pipeline inteira para aqui.
  build:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: [test, security, sast]
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build --build-arg APP_VERSION=ci-${{ github.sha }} -t projeto-devops:ci .

      - name: Subir o container
        run: docker run -d --name smoke -p 3000:3000 projeto-devops:ci

      - name: Smoke test no endpoint /health
        run: |
          for tentativa in $(seq 1 15); do
            if curl -fsS http://localhost:3000/health > /tmp/health.json; then
              echo "Aplicacao respondeu:"
              cat /tmp/health.json
              exit 0
            fi
            echo "Aguardando a aplicacao subir... ($tentativa/15)"
            sleep 2
          done
          echo "::error::A aplicacao nao respondeu no /health."
          docker logs smoke
          exit 1

      - name: Validar a criacao de uma tarefa no container
        run: |
          curl -fsS -X POST http://localhost:3000/api/tasks \
            -H 'Content-Type: application/json' \
            -d '{"title":"Tarefa criada pelo smoke test","priority":"alta"}' | tee /tmp/task.json
          grep -q '"id":1' /tmp/task.json

      - name: Derrubar o container
        if: always()
        run: docker rm -f smoke || true

  # ---------------------------------------------------------------- stage: DAST
  # Analise dinamica (OWASP ZAP baseline) contra a aplicacao em execucao.
  # So roda depois do build: precisa de uma imagem que ja passou nos testes.
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Subir a aplicacao
        run: |
          docker build --build-arg APP_VERSION=dast-${{ github.sha }} -t projeto-devops:dast .
          docker run -d --name alvo -p 3000:3000 projeto-devops:dast
          for tentativa in $(seq 1 15); do
            curl -fsS http://localhost:3000/health > /dev/null && exit 0
            echo "Aguardando a aplicacao subir... ($tentativa/15)"
            sleep 2
          done
          echo "::error::A aplicacao alvo nao subiu."
          docker logs alvo
          exit 1

      - name: Rodar o ZAP baseline scan
        # Codigos de saida do ZAP: 0 limpo, 1 falha, 2 avisos, 3 erro do scan.
        # Avisos (2) sao tolerados aqui; a validacao abaixo decide o resultado.
        run: |
          mkdir -p relatorios && chmod 777 relatorios
          set +e
          docker run --rm --network host -v "$PWD/relatorios:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
              -t http://localhost:3000 -J zap.json -r zap.html -I
          echo "Codigo de saida do ZAP: $?"
          exit 0

      - name: Validar o resultado (zero alertas de risco Alto)
        run: |
          test -f relatorios/zap.json || { echo "::error::O ZAP nao gerou relatorio."; exit 1; }
          read ALTO MEDIO BAIXO < <(node -e '
            const r = require("./relatorios/zap.json");
            const c = { 3: 0, 2: 0, 1: 0 };
            for (const s of r.site) for (const a of s.alerts) c[a.riskcode] = (c[a.riskcode] || 0) + 1;
            console.log(c[3], c[2], c[1]);
          ')
          {
            echo "## DAST (OWASP ZAP)"
            echo ""
            echo "| Risco | Alertas |"
            echo "|-------|---------|"
            echo "| Alto | $ALTO |"
            echo "| Medio | $MEDIO |"
            echo "| Baixo | $BAIXO |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$ALTO" -gt 0 ]; then
            echo "::error::O DAST encontrou $ALTO alerta(s) de risco Alto."
            exit 1
          fi
          echo "DAST sem alertas de risco Alto."

      - name: Publicar o relatorio do DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-dast
          path: relatorios/
          retention-days: 7

      - name: Derrubar o container
        if: always()
        run: docker rm -f alvo || true

  # ------------------------------------------------------------------- resultado
  resultado:
    name: Resultado da esteira
    runs-on: ubuntu-latest
    needs: [lint, test, security, sast, build, dast]
    if: always()
    steps:
      - name: Resumir no Summary
        run: |
          {
            echo "## Resultado da esteira de CI"
            echo ""
            echo "| Stage | Status |"
            echo "|-------|--------|"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| test | ${{ needs.test.result }} |"
            echo "| security | ${{ needs.security.result }} |"
            echo "| sast | ${{ needs.sast.result }} |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| dast | ${{ needs.dast.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Falhar se alguma stage nao passou
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
